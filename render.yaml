# Render Blueprint: Render reads this file and sets up the API service.
# In Render: New + -> Blueprint -> pick this repository.
services:
  - type: web
    name: food-price-api
    runtime: python
    plan: free
    rootDir: API
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      # Websites allowed to call the API from a browser (see main.py).
      # Render asks for the value when you create the service:
      # https://food-price-api-w69y.onrender.com,http://localhost:5000
      - key: ALLOWED_ORIGINS
        sync: false
